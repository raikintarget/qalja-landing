    --gold:#D9A441;--gold-soft:#EBD7A6;--gold-dim:#8A6E36;
    --text:#F2ECDD;--text-dim:#9A9384;--muted:#6E685C;
    --ok:#86B375;--bad:#CC6A5C;--warn:#E0A436;--info:#7BA7C9;

  .owner{margin-left:auto;display:flex;align-items:center;gap:9px}
  .owner .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2a2218,#3a2e1c);

  .msg .reply-box textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;

  .msg .reply-box textarea:focus{outline:none;border-color:var(--gold)}
  .msg .reply-box .ract{display:flex;gap:8px;margin-top:8px}
  .msg .reply-box .ract button{appearance:none;cursor:pointer;font-family:inherit;font-size:13px;border-radius:9px;padding:8px 14px;border:1px solid var(--gold-dim);background:transparent;color:var(--gold-soft);transition:.15s}

  .sys{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
  .sys:last-child{border-bottom:none} .sys .d{width:9px;height:9px;border-radius:50%;flex:none}
  .sys .d.ok{background:var(--ok)} .sys .d.warn{background:var(--warn)}
  .sys .t{flex:1} .sys .t b{font-size:14px;display:block} .sys .t small{color:var(--text-dim);font-size:12px}
  .sys .v{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--gold-soft)}

  .note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function loadClientMsgs(){
  try{
    const raw=JSON.parse(sessionStorage.getItem('specMsgs')||'[]');
    raw.forEach(m=>{
      const exists=MESSAGES.some(x=>x.text===m.text&&x.name===m.client);
      if(!exists) MESSAGES.unshift({id:Date.now()+Math.random(),
        ini:m.client.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),
        name:m.client,niche:m.niche||'—',time:m.time,tag:'q',unread:true,text:m.text,reply:''});
    });
    sessionStorage.removeItem('specMsgs');
  }catch(e){}
}

function rMessages(){
  loadClientMsgs();
  const tags={q:['q','Вопрос'],r:['r','Отзыв'],c:['c','Запрос']};
  content.innerHTML=`
  <div class="h1">Сообщения клиентов</div>
  <div class="h1s">Вопросы, запросы и отзывы из Telegram-бота</div>
  <div class="filters" style="margin-bottom:16px">
    <button class="on" onclick="showMsgs('all',this)">Все (${MESSAGES.length})</button>
    <button onclick="showMsgs('unread',this)" style="color:var(--bad);border-color:rgba(204,106,92,.3)">Непрочитанные (${MESSAGES.filter(m=>m.unread).length})</button>
    <button onclick="showMsgs('q',this)">Вопросы</button>
    <button onclick="showMsgs('c',this)">Запросы</button>
    <button onclick="showMsgs('r',this)">Отзывы</button>
  </div>
  <div class="msg-list" id="msgList">${MESSAGES.map(msgRow).join('')}</div>`;
  bindMsgActions();
}

function showMsgs(f,btn){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const list = f==='all' ? MESSAGES : f==='unread' ? MESSAGES.filter(m=>m.unread) : MESSAGES.filter(m=>m.tag===f);
  document.getElementById('msgList').innerHTML = list.map(msgRow).join('');
  bindMsgActions();
}

function msgRow(m){
  const tags={q:'Вопрос',r:'Отзыв',c:'Запрос'};
  return `<div class="msg ${m.unread?'unread':''}" id="msg${m.id}">
    <div class="mh">
      <div class="mav">${m.ini}</div>
      <div class="minfo"><b>${m.name}</b><small>${m.niche}</small></div>
      <span class="mtag ${m.tag}">${tags[m.tag]}</span>
      <span class="mtime">${m.time}</span>
    </div>
    <div class="mbody">${m.text}</div>
    ${m.reply ? `
    <div style="background:rgba(134,179,117,.07);border:1px solid rgba(134,179,117,.2);border-radius:9px;padding:10px 13px;font-size:13px;color:var(--text-dim);line-height:1.55;margin-bottom:8px">
      <span style="font-size:11px;color:var(--ok);font-weight:600;display:block;margin-bottom:4px">✓ Ответ отправлен</span>
      ${m.reply}
    </div>` : ''}
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="toggleReply(${m.id})" style="appearance:none;cursor:pointer;font-family:inherit;font-size:12.5px;border-radius:8px;padding:7px 13px;border:1px solid var(--gold-dim);background:transparent;color:var(--gold-soft)">
        ${m.reply?'Дополнить ответ':'Ответить'}
      </button>
      ${m.unread?`<button onclick="markRead(${m.id})" style="appearance:none;cursor:pointer;font-family:inherit;font-size:12px;border-radius:8px;padding:7px 13px;border:1px solid var(--line);background:transparent;color:var(--text-dim)">Прочитано ✓</button>`:''}
    </div>
    <div class="reply-box">
      <textarea placeholder="Напишите ответ — отправится клиенту в Telegram...">${m.reply||''}</textarea>
      <div class="ract">
        <button class="send" onclick="sendReply(${m.id})">Отправить в Telegram ✈️</button>
        <button onclick="toggleReply(${m.id})">Отмена</button>
      </div>
    </div>
  </div>`;
}

function toggleReply(id){
  const el=document.getElementById('msg'+id);
  if(el) el.classList.toggle('open');
}
function markRead(id){
  const m=MESSAGES.find(x=>x.id===id);
  if(m) m.unread=false;
  rMessages();
}
function sendReply(id){
  const el=document.getElementById('msg'+id);
  const ta=el?el.querySelector('textarea'):null;
  if(!ta||!ta.value.trim()){alert('Напишите ответ');return;}
  const m=MESSAGES.find(x=>x.id===id);
  if(m){m.reply=ta.value.trim();m.unread=false;}
  rMessages();
}
