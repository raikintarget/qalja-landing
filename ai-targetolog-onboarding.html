<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-таргетолог — подключение и панель управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0D0B;--surface:#181613;--surface-2:#221F19;--line:#2F2A22;
    --gold:#D9A441;--gold-soft:#EBD7A6;--gold-dim:#8A6E36;
    --text:#F2ECDD;--text-dim:#9A9384;--muted:#6E685C;
    --ok:#86B375;--bad:#CC6A5C;--warn:#E0A436;
    --r:14px;--ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1000px 600px at 50% -15%,#1c1813 0,transparent 60%),var(--bg);
    color:var(--text);font-family:"Manrope",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
  .wrap{max-width:880px;margin:0 auto}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:8px;font-family:"Unbounded";font-weight:600;font-size:13px;
    letter-spacing:.02em;color:var(--gold-soft)}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(217,164,65,.16)}
  .steps{margin-left:auto;display:flex;gap:6px;align-items:center}
  .steps .s{width:26px;height:4px;border-radius:99px;background:var(--surface-2);transition:background .3s}
  .steps .s.on{background:var(--gold)} .steps .s.done{background:var(--gold-dim)}

  h1{font-family:"Unbounded";font-weight:600;font-size:clamp(22px,5vw,30px);line-height:1.12;letter-spacing:-.01em;margin-bottom:8px}
  .sub{color:var(--text-dim);font-size:15px;margin-bottom:24px;max-width:60ch}
  .eyebrow{font-family:"Unbounded";font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);margin-bottom:12px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;
    animation:rise .4s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* connect rows */
  .conn{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
  .conn:last-child{border-bottom:none}
  .conn .ic{width:40px;height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
  .conn .t{flex:1;min-width:0} .conn .t b{font-size:14.5px;display:block} .conn .t small{color:var(--muted);font-size:12.5px}
  .conn input{width:100%;margin-top:7px;font-family:inherit;font-size:14px;color:var(--text);background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .conn input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.18)}

  .pill{font-family:"Unbounded";font-weight:500;font-size:12px;padding:8px 14px;border-radius:99px;cursor:pointer;
    border:1px solid var(--gold-dim);background:transparent;color:var(--gold-soft);transition:.18s;white-space:nowrap}
  .pill:hover{background:rgba(217,164,65,.08)}
  .pill.ok{background:rgba(134,179,117,.14);border-color:rgba(134,179,117,.4);color:var(--ok);cursor:default}
  .pill:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(217,164,65,.3)}

  /* form fields */
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:7px;font-weight:500}
  .field label .hint{color:var(--muted);font-weight:400}
  .field input,.field select{width:100%;font-family:inherit;font-size:15px;color:var(--text);background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.18)}
  .suffix{position:relative} .suffix input{padding-right:42px}
  .suffix .sfx{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-family:"JetBrains Mono",monospace}

  /* toggle */
  .tog{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
  .tog:last-child{border-bottom:none}
  .tog .t b{font-size:14.5px;display:block} .tog .t small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
  .sw{appearance:none;width:46px;height:26px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);
    position:relative;cursor:pointer;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
  .sw:checked{background:rgba(217,164,65,.25);border-color:var(--gold-dim)}
  .sw:checked::after{left:22px;background:var(--gold)}
  .sw:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(217,164,65,.3)}

  .seg{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
  .seg button{flex:1;appearance:none;border:none;background:none;cursor:pointer;font-family:inherit;font-size:13px;
    color:var(--text-dim);padding:9px;border-radius:7px;transition:.15s}
  .seg button.on{background:var(--gold);color:#1a1305;font-weight:600}

  .btn{appearance:none;cursor:pointer;font-family:"Unbounded";font-weight:600;font-size:15px;border:none;border-radius:12px;
    padding:14px 22px;background:linear-gradient(180deg,#E6B453,var(--gold));color:#1a1305;transition:transform .12s,filter .18s;width:100%}
  .btn:hover{filter:brightness(1.05)} .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(217,164,65,.4)}
  .btn.ghost{background:transparent;color:var(--gold-soft);border:1px solid var(--gold-dim);width:auto;padding:11px 18px;font-weight:500;font-size:14px}
  .btn.ghost:hover{filter:none;background:rgba(217,164,65,.07)}
  .nav{display:flex;gap:12px;align-items:center;margin-top:6px}
  .nav .back{margin-right:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;font-family:inherit;font-size:14px;padding:8px 0}
  .nav .back:hover{color:var(--text)}

  .dirlist{margin-top:4px}
  .diritem{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;margin-bottom:9px;animation:rise .3s var(--ease) both}
  .diritem b{font-size:14px} .diritem small{color:var(--muted);font-size:12px;font-family:"JetBrains Mono",monospace}
  .diritem .x{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
  .diritem .x:hover{color:var(--bad)}

  /* panel */
  .banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(134,179,117,.12),rgba(217,164,65,.08));
    border:1px solid rgba(134,179,117,.35);border-radius:var(--r);padding:15px 17px;margin-bottom:16px}
  .banner .live{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:blink 1.2s infinite;flex:none}
  @keyframes blink{50%{opacity:.3}}
  .banner b{font-family:"Unbounded";font-weight:600;font-size:15px;display:block}
  .banner small{color:var(--text-dim);font-size:12.5px}
  .banner .sw{margin-left:auto}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
  .kpi small{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px}
  .kpi b{font-family:"Unbounded";font-weight:600;font-size:19px;display:block}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:3px;color:var(--ok)}

  .pcols{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:720px){.pcols{grid-template-columns:1fr 1fr}}
  .pan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .pan h3{font-family:"Unbounded";font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:13px}
  .set{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
  .set:last-child{border-bottom:none} .set span{color:var(--text-dim)} .set b{font-family:"JetBrains Mono",monospace;font-weight:500;color:var(--gold-soft)}
  .log{font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.75;color:var(--text-dim);max-height:230px;overflow:auto}
  .log div{opacity:0;animation:fade .35s forwards} .log .tm{color:var(--gold-dim)} .log .hl{color:var(--gold-soft)}
  @keyframes fade{to{opacity:1}}

  .note{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* Budget modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,9,7,.82);backdrop-filter:blur(6px);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;animation:mo-fadein .22s ease both}
  @keyframes mo-fadein{from{opacity:0}to{opacity:1}}
  .modal-sheet{width:100%;max-width:580px;background:var(--surface);border-radius:22px 22px 0 0;
    border:1px solid var(--line);border-bottom:none;padding:10px 22px max(28px,env(safe-area-inset-bottom));
    animation:mo-up .3s var(--ease) both}
  @keyframes mo-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .mo-handle{width:40px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 20px}
  .mo-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(134,179,117,.12);
    border:1px solid rgba(134,179,117,.3);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--ok);margin-bottom:14px}
  .mo-badge .blink{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:bpulse 1.4s infinite}
  @keyframes bpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand"><span class="dot"></span>@smarttarget.ai</div>
    <div class="steps" id="steps"></div>
  </div>
  <div id="app"></div>
  <p class="note">Демо интерфейса клиента. Подключения и данные показаны для примера.</p>
</div>

<script>
const $=s=>document.querySelector(s);
const app=$("#app");
const S={
  screen:"connect", step:0,
  conn:{meta:false,tg:false,wa:"",metaMode:"",bmId:"",accountId:"",accountName:"",ig:"",fb:"",fbMode:"",igLogin:"",igPass:"",igStep:null,waPhone:"",waStep:null},
  dirs:[],
  draft:{name:"",budget:5000,target:2,max:5,wa:"",dest:"",cities:"",geoWide:false,ageFrom:"18",ageTo:"45",gender:"all",audience:"",url:""},
  ap:{mode:"auto",vampire:true,scale:true,scaleStep:30,regen:true,time:"08:00",freq:"daily",cap:50000,on:false},
  cr:{budget:2000,days:3,autocopy:true,lang:"kz-ru",tone:"Премиум, тёплый, уверенный. Казахско-русский."},
  budget:{fb:"own",card:false,daily:10,weeks:1,consult:false},
  client:{name:"Жан Сұлу",niche:"Бьюти-клиника · Астана"}
};
const SCREENS=["connect","direction","autopilot","creative","panel"];
const STEP_OF={connect:0,direction:1,autopilot:2,creative:3,panel:4};

function steps(){
  const cur=STEP_OF[S.screen];
  $("#steps").innerHTML=[0,1,2,3,4].map(i=>
    `<span class="s ${i<cur?'done':i===cur?'on':''}"></span>`).join("");
}
function go(scr){ S.screen=scr; render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- 1. CONNECT ---------- */
const OUR_BM_ID = '2704422019909146'; // SmartTarget AI Business Portfolio ID

function vConnect(){
  const mode = S.conn.metaMode; // 'partner' | 'nofb'
  const connected = S.conn.meta; // true = аккаунт расталды

  app.innerHTML=`
  <div class="eyebrow">Шаг 1 · Подключение</div>
  <h1>Подключим вашу рекламу</h1>
  <p class="sub">Выберите способ подключения рекламного аккаунта.</p>

  <!-- Таңдау -->
  <div class="card" style="margin-bottom:14px;padding:6px">
    <div id="optPartner" style="cursor:pointer;border-radius:10px;padding:14px;display:flex;align-items:center;gap:13px;${mode==='partner'?'background:rgba(217,164,65,.07);border:1px solid var(--gold-dim)':'border:1px solid transparent'}">
      <div class="ic">🤝</div>
      <div class="t"><b>Есть Facebook Ads</b><br><small>Добавите нас как партнёра в Business Manager</small></div>
      <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${mode==='partner'?'var(--gold)':'var(--muted)'};background:${mode==='partner'?'var(--gold)':'transparent'};flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#1a1104">${mode==='partner'?'✓':''}</div>
    </div>
    <div id="optNofb" style="cursor:pointer;border-radius:10px;padding:14px;display:flex;align-items:center;gap:13px;margin-top:4px;${mode==='nofb'?'background:rgba(217,164,65,.07);border:1px solid var(--gold-dim)':'border:1px solid transparent'}">
      <div class="ic">🆕</div>
      <div class="t"><b>Facebook / Meta нет</b><br><small>Специалист создаст кабинет и подключит всё сам</small></div>
      <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${mode==='nofb'?'var(--gold)':'var(--muted)'};background:${mode==='nofb'?'var(--gold)':'transparent'};flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#1a1104">${mode==='nofb'?'✓':''}</div>
    </div>
  </div>

  ${mode==='partner' ? `
  <!-- ПАРТНЕР СЦЕНАРИЙІ -->
  <div class="card" style="margin-bottom:14px">
    <div style="background:rgba(134,179,117,.07);border:1px solid rgba(134,179,117,.25);border-radius:10px;padding:12px 15px;margin-bottom:18px;font-size:13px;line-height:1.6">
      🔒 <b style="color:var(--ok)">Безопасно.</b> Партнёрский доступ — мы управляем рекламой, но не можем снимать деньги или менять платёжные данные.
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;font-size:13px;line-height:1.65">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-family:'Unbounded',sans-serif;font-weight:700;color:var(--gold);min-width:24px">1</span>
        <span>Откройте <a href="https://business.facebook.com" target="_blank" style="color:var(--gold)">business.facebook.com</a> → <b>Настройки</b> → <b>Партнёры</b> → «Добавить партнёра»</span>
      </div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-family:'Unbounded',sans-serif;font-weight:700;color:var(--gold);min-width:24px">2</span>
        <div style="flex:1;min-width:0">
          <div style="margin-bottom:8px">Введите наш <b>ID Business Manager:</b></div>
          <div style="background:var(--bg);border:1px solid var(--gold-dim);border-radius:8px;padding:11px 15px;font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--gold-soft);display:flex;align-items:center;justify-content:space-between;gap:10px">
            <span>${OUR_BM_ID}</span>
            <button onclick="navigator.clipboard.writeText('${OUR_BM_ID}');this.textContent='✓';setTimeout(()=>this.textContent='Копировать',2000)" style="appearance:none;background:transparent;border:1px solid var(--gold-dim);border-radius:6px;color:var(--gold-soft);font-family:inherit;font-size:11px;padding:5px 10px;cursor:pointer;white-space:nowrap">Копировать</button>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-family:'Unbounded',sans-serif;font-weight:700;color:var(--gold);min-width:24px">3</span>
        <span>Назначьте нас партнёром для <b>рекламного аккаунта</b> → роль <b>«Manage campaigns»</b></span>
      </div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-family:'Unbounded',sans-serif;font-weight:700;color:var(--gold);min-width:24px">4</span>
        <div style="flex:1;min-width:0">
          <div style="margin-bottom:8px">Введите ваш <b>ID рекламного аккаунта</b> — проверим доступ:</div>
          <div style="position:relative">
            <input id="accIdInput" type="text" placeholder="например: 1234567890123456"
              value="${S.conn.accountId||''}"
              style="width:100%;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);background:var(--bg);border:1px solid ${connected?'var(--ok)':'var(--line)'};border-radius:8px;padding:11px 13px;padding-right:${connected?'110px':'13px'}">
            ${connected?`<span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:12px;font-weight:600;pointer-events:none">✓ Доступ есть</span>`:''}
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:5px">Найдёте в URL Ads Manager: <code style="font-size:11px">act_XXXXXXXX</code> — скопируйте цифры</div>
        </div>
      </div>
    </div>
  </div>
  ` : mode==='nofb' ? `
  <!-- FACEBOOK ЖОҚ СЦЕНАРИЙІ -->
  <div class="card" style="margin-bottom:14px">
    <div style="background:rgba(123,167,201,.07);border:1px solid rgba(123,167,201,.25);border-radius:10px;padding:13px 15px;margin-bottom:18px;font-size:13px;line-height:1.6">
      👋 Оставьте контакты — <b style="color:#7BA7C9">специалист свяжется</b>, создаст рекламный кабинет и подключит всё сам.
    </div>
    <div class="field">
      <label>Логин Instagram <span style="color:var(--muted);font-weight:400">— страница, с которой будет выходить реклама</span></label>
      <input id="nofbIg" type="text" placeholder="@yourpage" value="${S.conn.igLogin||''}"
        oninput="S.conn.igLogin=this.value.trim()">
    </div>
    <div class="field" style="margin-bottom:0">
      <label>WhatsApp / Телефон <span style="color:var(--muted);font-weight:400">— для связи со специалистом</span></label>
      <input id="nofbWa" type="tel" placeholder="+7 777 000 00 00" value="${S.conn.waPhone||''}"
        oninput="S.conn.waPhone=this.value.trim()">
    </div>
  </div>
  ` : ''}

  ${mode ? `
  <!-- TELEGRAM -->
  <div class="card" style="margin-bottom:14px">
    <div class="conn" style="align-items:flex-start">
      <div class="ic">✈️</div>
      <div class="t">
        <b>Telegram-бот SmartTarget AI</b>
        <small>Ежедневные отчёты · уведомления · связь со специалистом</small>
        ${S.conn.tg ? `
        <div style="display:flex;align-items:center;gap:8px;margin-top:9px;color:var(--ok);font-size:13px;font-weight:600">
          ✓ Telegram подключён
          <button onclick="S.conn.tg=false;vConnect()" style="appearance:none;background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer">Изменить</button>
        </div>` : `
        <div style="margin-top:12px">
          <a href="https://t.me/SmartTargetAIBot" target="_blank" style="display:inline-flex;align-items:center;gap:7px;background:rgba(123,167,201,.1);border:1px solid rgba(123,167,201,.3);border-radius:8px;padding:10px 15px;font-size:13px;color:#7BA7C9;text-decoration:none;font-weight:600">
            ✈️ Открыть @SmartTargetAIBot
          </a>
          <div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6">Напишите <b>/start</b> — бот свяжет аккаунт автоматически.</div>
          <button onclick="S.conn.tg=true;vConnect()" style="appearance:none;margin-top:10px;background:transparent;border:1px solid var(--ok);border-radius:8px;padding:9px 15px;color:var(--ok);font-family:inherit;font-size:13px;cursor:pointer;font-weight:500">✓ Написал, готово</button>
        </div>`}
      </div>
    </div>
  </div>
  ` : ''}

  <div class="nav">
    ${mode==='partner' ? `
      <button class="btn" id="connVerify" style="width:auto;padding:14px 22px;${connected?'display:none':''}" ${S.conn.accountId?'':'disabled'}>
        Проверить доступ
      </button>
      <button class="btn" id="connNext" style="${connected&&S.conn.tg?'':'display:none'}">
        Продолжить →
      </button>
    ` : mode==='nofb' ? `
      <button class="btn" id="connNext" ${S.conn.tg?'':'disabled'}>
        Отправить специалисту →
      </button>
    ` : ''}
  </div>`;

  $("#optPartner").onclick=()=>{ S.conn.metaMode='partner'; S.conn.meta=false; vConnect(); };
  $("#optNofb").onclick=()=>{ S.conn.metaMode='nofb'; S.conn.meta=false; vConnect(); };

  if(mode==='partner'){
    if($("#accIdInput")) $("#accIdInput").oninput=e=>{
      S.conn.accountId=e.target.value.trim();
      S.conn.meta=false;
      if($("#connVerify")) $("#connVerify").disabled=!S.conn.accountId;
    };
    if($("#connVerify")) $("#connVerify").onclick=submitPartner;
    if($("#connNext"))   $("#connNext").onclick=()=>go("direction");
  }
  if(mode==='nofb'){
    if($("#connNext")) $("#connNext").onclick=submitNofb;
  }
}

function checkConnReady(){ vConnect(); }

async function submitPartner(){
  const btn=$("#connVerify");
  if(btn){btn.textContent='Проверяем…';btn.disabled=true;}
  const token = localStorage.getItem('st_token')||'';
  try {
    const r = await fetch('/api/connect/partner',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({account_id: S.conn.accountId})
    });
    const data = await r.json();
    if(r.ok){
      S.conn.meta=true;
      S.conn.accountName=data.account;
      vConnect();
    } else {
      if(btn){btn.textContent='Проверить доступ';btn.disabled=false;}
      alert('❌ '+(data.error||'Доступ не найден. Добавьте нас партнёром и попробуйте снова.'));
    }
  } catch(e){
    if(btn){btn.textContent='Проверить доступ';btn.disabled=false;}
    alert('⚠️ Ошибка соединения. Попробуйте ещё раз.');
  }
}

async function submitNofb(){
  const btn=$("#connNext");
  if(btn){btn.textContent='Отправляем…';btn.disabled=true;}
  const token = localStorage.getItem('st_token')||'';
  try {
    await fetch('/api/connect/nofb',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({ig_login:S.conn.igLogin, wa_phone:S.conn.waPhone})
    });
    go("direction");
  } catch(e){
    if(btn){btn.textContent='Отправить специалисту →';btn.disabled=false;}
    alert('⚠️ Ошибка. Попробуйте ещё раз.');
  }
}

        <textarea id="specMsg" placeholder="Напр.: у нас два города — Астана и Алматы, можно ли запустить разные объявления для каждого?" style="width:100%;font-family:inherit;font-size:13.5px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:72px;line-height:1.5"></textarea>
        <button id="sendSpec" style="appearance:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;margin-top:9px;background:rgba(123,167,201,.12);border:1px solid rgba(123,167,201,.3);border-radius:9px;padding:10px 18px;color:#7BA7C9;transition:.15s" onmouseover="this.style.background='rgba(123,167,201,.2)'" onmouseout="this.style.background='rgba(123,167,201,.12)'">
          ✈️ Отправить специалисту
        </button>
        <div id="specSent" style="display:none;color:var(--ok);font-size:13px;font-weight:600;margin-top:9px">✓ Сообщение отправлено — ответим в Telegram</div>
      </div>
    </div>
  </div>

  ${S.dirs.length?`
  <div class="card">
    <h3 style="font-family:Unbounded;font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px">Добавленные направления (${S.dirs.length})</h3>
    <div class="dirlist" id="dl"></div>
  </div>`:''}

  <div class="nav">
    <button class="back" id="back">← Назад</button>
    <button class="btn" id="next" style="width:auto;padding:14px 24px">Дальше — автопилот →</button>
  </div>`;

  const read=()=>{
    S.draft.name=($("#dName")||{}).value?.trim()||S.draft.name;
    S.draft.budget=+($("#dBudget")||{}).value||5000;
    S.draft.target=+($("#dTarget")||{}).value||2;
    S.draft.max=+($("#dMax")||{}).value||5;
    S.draft.wa=($("#dWa")||{}).value?.trim()||'';
    if(!S.draft.geoWide) S.draft.cities=($("#dCities")||{}).value?.trim()||S.draft.cities||'';
    S.draft.ageFrom=($("#dAgeFrom")||{}).value||'18';
    S.draft.ageTo=($("#dAgeTo")||{}).value||'45';
    S.draft.audience=($("#dAudience")||{}).value??S.draft.audience??'';
    if($("#dUrl")) S.draft.url=$("#dUrl").value.trim();
  };

  function tryAddDir(){
    read();
    if(!S.draft.name){ const el=$("#dName");if(el){el.style.borderColor='var(--bad)';el.focus();}return false; }
    if(!S.draft.dest){
      const msg=document.createElement('div');
      msg.style.cssText='color:var(--bad);font-size:12.5px;margin-top:6px';
      msg.textContent='Выберите куда вести клиентов ↑';
      msg.className='dest-err';
      const df=document.querySelector('[data-dest]')?.closest('.field');
      if(df&&!df.querySelector('.dest-err')) df.appendChild(msg);
      return false;
    }
    if(!S.draft.geoWide&&!S.draft.cities){ const el=$("#dCities");if(el){el.style.borderColor='var(--bad)';el.focus();}return false; }
    S.dirs.push({...S.draft});
    S.draft={name:'',budget:5000,target:2,max:5,wa:'',dest:'',cities:'',geoWide:false,ageFrom:'18',ageTo:'45',gender:'all',audience:'',url:''};
    return true;
  }

  $("#addDir").onclick=()=>{ if(tryAddDir()) vDirection(); };

  // File upload handler
  window.handleFiles=function(files){
    const list=document.getElementById('fileList');
    if(!list) return;
    Array.from(files).forEach(f=>{
      const ext=f.name.split('.').pop().toLowerCase();
      const icon=ext==='pdf'?'📄':f.type.startsWith('video')?'🎬':'🖼';
      if(f.size>500*1024*1024){ alert(`Файл "${f.name}" превышает 500 МБ`); return; }
      const size=(f.size/1024/1024).toFixed(1);
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 13px';
      row.innerHTML=`<span style="font-size:18px;flex:none">${icon}</span>
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div>
        <div style="font-size:11.5px;color:var(--muted)">${size} МБ</div></div>
        <span style="font-size:11.5px;color:var(--ok);font-weight:600">✓ Загружен</span>`;
      list.appendChild(row);
    });
  };

  // Send to specialist
  if($("#sendSpec")) $("#sendSpec").onclick=()=>{
    const msg=(document.getElementById('specMsg')||{}).value?.trim();
    if(!msg){ document.getElementById('specMsg').style.borderColor='var(--bad)'; return; }
    // Add to superadmin messages (stored in sessionStorage for demo)
    try{
      const msgs=JSON.parse(sessionStorage.getItem('specMsgs')||'[]');
      msgs.push({time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}),
        client:S.client.name, niche:S.client.niche, text:msg, unread:true, tag:'q'});
      sessionStorage.setItem('specMsgs',JSON.stringify(msgs));
    }catch(e){}
    document.getElementById('sendSpec').style.display='none';
    document.getElementById('specSent').style.display='block';
  };

  if(S.dirs.length){
    const destLabel={wa:'WhatsApp',direct:'Direct',traffic:'Сайт'};
    $("#dl").innerHTML=S.dirs.map((d,i)=>`
      <div class="diritem">
        <div style="flex:1;min-width:0">
          <b>${d.name}</b>
          <small>${d.budget.toLocaleString()}₸/день · ${destLabel[d.dest]||'—'} · ${d.geoWide?'🇰🇿 Казахстан':d.cities||'—'} · ${d.ageFrom}–${d.ageTo} лет</small>
        </div>
        <button class="x" data-i="${i}">×</button>
      </div>`).join('');
    $("#dl").querySelectorAll(".x").forEach(b=>b.onclick=()=>{S.dirs.splice(+b.dataset.i,1);vDirection();});
  }

  $("#back").onclick=()=>go("connect");
  $("#next").onclick=()=>{
    // Auto-save current form if name is filled
    read();
    if(S.draft.name){
      if(!S.draft.dest||(!S.draft.geoWide&&!S.draft.cities)){ tryAddDir(); return; }
      tryAddDir();
    }
    if(!S.dirs.length){ const el=$("#dName");if(el){el.style.borderColor='var(--bad)';el.scrollIntoView({behavior:'smooth'});el.focus();} return; }
    go("autopilot");
  };
}

          <label>CVV / CVC</label>
          <input id="mCardCvv" type="password" inputmode="numeric" maxlength="3" placeholder="•••"
            oninput="this.value=this.value.replace(/\D/g,'').slice(0,3);S.budget.cardCvv=this.value"
            style="font-family:'JetBrains Mono',monospace;font-size:16px" value="${b.cardCvv||''}">
        </div>
      </div>
      <div class="field">
        <label>Имя на карте</label>
        <input id="mCardName" type="text" placeholder="IVAN IVANOV"
          oninput="this.value=this.value.toUpperCase();S.budget.cardName=this.value"
          style="font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.04em" value="${b.cardName||''}">
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start">
        <span>🔒</span><span>Данные карты передаются по защищённому соединению. Списание однократное — предоплата за рекламный бюджет.</span>
      </div>
      `}

      <button onclick="confirmBudget()" class="btn" style="font-size:15px;padding:15px">
        ${isOwn ? '🚀 Запустить рекламу' : '💳 Внести предоплату и запустить'}
      </button>
      <button onclick="document.getElementById('budgetModal').remove()" style="appearance:none;background:none;border:none;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;width:100%;padding:12px 0;margin-top:4px">Закрыть</button>
    </div>`;

  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

function confirmBudget(){
  const isOwn = S.conn.metaMode==='own';
  if(!isOwn){
    const num=(S.budget.cardNum||'').replace(/\s/g,'');
    const exp=S.budget.cardExp||'';
    const cvv=S.budget.cardCvv||'';
    const name=S.budget.cardName||'';
    if(num.length<16){alert('Введите полный номер карты');return;}
    if(exp.length<5){alert('Введите срок действия (ММ/ГГ)');return;}
    if(cvv.length<3){alert('Введите CVV/CVC');return;}
    if(!name.trim()){alert('Введите имя держателя карты');return;}
  }
  const overlay=document.getElementById('budgetModal');
  if(overlay){
    overlay.querySelector('.modal-sheet').innerHTML=`
      <div class="mo-handle"></div>
      <div style="text-align:center;padding:20px 0 30px">
        <div style="font-size:52px;margin-bottom:16px">🚀</div>
        <div style="font-family:'Unbounded',sans-serif;font-weight:600;font-size:20px;margin-bottom:10px">Реклама запущена!</div>
        <div style="font-size:14px;color:var(--text-dim);line-height:1.6;max-width:36ch;margin:0 auto 20px">
          ${isOwn ? 'AI-автопилот начал работу. Первый отчёт придёт в Telegram завтра в 08:00.' : 'Предоплата принята. AI-автопилот включён — первый отчёт придёт в Telegram завтра в 08:00.'}
        </div>
        <button onclick="document.getElementById('budgetModal').remove();vPanel()" class="btn" style="width:auto;padding:12px 28px">Отлично ✓</button>
      </div>`;
  }
}

async function giveCreative(){
  const btn=$("#giveCre"); btn.disabled=true; btn.textContent="AI обрабатывает…";
  const log=$("#plog");
  const now=new Date();const hh=String(8).padStart(2,'0');
  const add=(t,h)=>{const d=document.createElement("div");d.innerHTML=`<span class="tm">${t}</span> ${h}`;log.appendChild(d);log.scrollTop=log.scrollHeight;};
  creativeCount++;
  const nm=`Новый креатив #${creativeCount}`;
  add("сейчас",`📎 Получен креатив — <span class="hl">проверяю</span>`);
  await sleep(800);
  add("сейчас",`✓ Качество ОК · добавляю в тест с бюджетом <span class="hl">${S.cr.budget.toLocaleString()}₸/день</span>`);
  await sleep(750);
  if(S.cr.autocopy){
    const langTxt={"kz-ru":"каз-рус","kz":"казахском","ru":"русском"}[S.cr.lang];
    add("сейчас",`✍️ Сгенерирован текст на <span class="hl">${langTxt}</span> в тоне бренда`);
    await sleep(750);
  }
  add("сейчас",`🚀 <span class="hl">${nm}</span> запущен · тест ${S.cr.days} дн. · цель CPL ≤ $${S.dirs[0]?S.dirs[0].target:2}`);
  btn.disabled=false; btn.textContent="📎 Дать ещё креатив";
}

/* ---------- router ---------- */
function render(){
  steps();
  ({connect:vConnect,direction:vDirection,autopilot:vAutopilot,creative:vCreative,panel:vPanel}[S.screen])();
}
render();
</script>
</body>
</html>
